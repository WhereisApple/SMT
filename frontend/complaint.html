<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMT - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container" data-page="login">
        <div class="auth-card">
            <h1>🏢 Society Maintenance Tracker</h1>
            <h2>Login</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginEmail">Email:</label>
                    <input type="email" id="loginEmail" placeholder="Enter your email" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password:</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required>
                </div>

                <button type="button" id="loginBtn" class="btn btn-primary full-width">Login</button>
            </form>

            <p class="text-center">Don't have an account?
                <button id="goToRegisterBtn" class="link-btn">Register here</button>
            </p>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
